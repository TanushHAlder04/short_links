name: Optional staging checks
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'
permissions:
  contents: read
jobs:
  benchmark:
    if: vars.ENABLE_STAGING_CHECKS == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      HOT_CODE: ${{ vars.STAGING_HOT_CODE }}
      COLD_CODES: ${{ vars.STAGING_COLD_CODES }}
      API_KEY: ${{ secrets.STAGING_API_KEY }}
      SESSION_COOKIE: ${{ secrets.STAGING_SESSION_COOKIE }}
      CONFIRM_STAGING: 'yes'
      CONFIRM_TEST_REDIS: 'yes'
      TEST_UPSTASH_URL: ${{ secrets.TEST_UPSTASH_URL }}
      TEST_UPSTASH_TOKEN: ${{ secrets.TEST_UPSTASH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - run: mkdir -p reports && k6 run --summary-export reports/k6.json load-test/staging.js
      - name: Dedicated Redis smoke
        if: env.TEST_UPSTASH_URL != ''
        run: node scripts/upstash-smoke.mjs
      - run: npm run audit:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-reports
          path: reports/
